<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to PDF</title>

    <link rel="stylesheet" href="../style.css">

    <style>
        .container{
            max-width:700px;
            margin:auto;
            padding:20px;
        }

        .title{
            text-align:center;
            margin-bottom:25px;
        }

        .btn{
            width:100%;
            padding:15px;
            border:none;
            border-radius:12px;
            font-size:18px;
            cursor:pointer;
            margin-top:15px;
        }

        .btn-primary{
            background:#e53935;
            color:#fff;
        }

        .btn-success{
            background:#43a047;
            color:#fff;
        }

        #preview{
            margin-top:25px;
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:10px;
        }

        #preview img{
            width:100%;
            border-radius:12px;
            object-fit:cover;
        }
    </style>
</head>

<body>

<div class="container">

<h2 class="title">
Image → PDF
</h2>

<button
id="pickImages"
class="btn btn-primary">

Pilih Gambar

</button>

<div id="preview"></div>

<button
id="convert"
class="btn btn-success">

Convert ke PDF

</button>

</div>

<script type="module" src="../js/image-to-pdf.js"></script>

</body>
</html>
